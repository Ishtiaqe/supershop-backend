steps:
  # Build and push the container image using Kaniko for layer caching.
  # This drastically speeds up incremental builds by caching NPM/Prisma layers.
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - --destination=asia-southeast1-docker.pkg.dev/shomaj-817b0/cloud-run-source-deploy/supershop-backend/supershop-backend:$COMMIT_SHA
      - --cache=true
      - --cache-ttl=168h # Cache layers for 7 days
      - --cache-repo=asia-southeast1-docker.pkg.dev/shomaj-817b0/cloud-run-source-deploy/supershop-backend/supershop-backend-cache
      - --network=host

  # Deploy the updated image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - supershop-backend
      - --image=asia-southeast1-docker.pkg.dev/shomaj-817b0/cloud-run-source-deploy/supershop-backend/supershop-backend:$COMMIT_SHA
      - --region=asia-southeast1
      - --platform=managed
      - --cpu=1
      - --memory=256Mi
      - --min-instances=0
      - --cpu-throttling
      - --cpu-boost
      - --quiet

tags:
  - supershop-backend
  - optimized-kaniko-build

images:
  - asia-southeast1-docker.pkg.dev/shomaj-817b0/cloud-run-source-deploy/supershop-backend/supershop-backend:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
